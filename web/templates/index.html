<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AutoOps AI Agent Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial; margin: 20px; }
    button { padding: 8px 12px; margin-right: 10px; }
    pre { background:#111; color:#0f0; padding:12px; overflow:auto; max-height: 60vh;}
  </style>
</head>
<body>
  <h2>AutoOps AI Agent Pro</h2>
  <button id="run">Run Analysis</button>
  <button id="history">History</button>
  <pre id="out"></pre>
  <script>
    const output = document.getElementById('out')

    async function showResult(path, options) {
      try {
        const response = await fetch(path, options)
        if (!response.ok) throw new Error(`Request failed (${response.status})`)
        output.textContent = JSON.stringify(await response.json(), null, 2)
      } catch (error) {
        output.textContent = error.message
      }
    }

    document.getElementById('run').addEventListener('click', () => showResult('/run', {
      method: 'POST',
      headers: { 'X-AutoOps-Request': '1' },
    }))
    document.getElementById('history').addEventListener('click', () => showResult('/history'))
  </script>
</body>
</html>
