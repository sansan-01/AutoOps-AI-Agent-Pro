<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AutoOps AI Agent Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial; margin: 20px; }
    button { padding: 8px 12px; margin-right: 10px; }
    pre { background:#111; color:#0f0; padding:12px; overflow:auto; max-height: 60vh;}
  </style>
</head>
<body>
  <h2>AutoOps AI Agent Pro</h2>
  <button onclick="run()">Run Analysis</button>
  <button onclick="history()">History</button>
  <pre id="out"></pre>
  <script>
    function run(){
      fetch('/run').then(r=>r.json()).then(d=>{
        document.getElementById('out').innerText = JSON.stringify(d, null, 2)
      })
    }
    function history(){
      fetch('/history').then(r=>r.json()).then(d=>{
        document.getElementById('out').innerText = JSON.stringify(d, null, 2)
      })
    }
  </script>
</body>
</html>
